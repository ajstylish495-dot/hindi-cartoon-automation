name: Hindi Cartoon Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

jobs:
  run-cartoon:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cartoon Script
        run: python main.py